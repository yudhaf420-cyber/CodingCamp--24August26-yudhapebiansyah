<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern To-Do List Life Dashboard with focus timer and quick links">
    <title>To-Do List Life Dashboard</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS (tetap dipertahankan untuk styling tambahan) -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#8b5cf6',
                        secondary: '#06b6d4',
                        accent: '#ec4899',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50 dark:from-slate-900 dark:via-slate-800 dark:to-indigo-950 min-h-screen text-slate-900 dark:text-white p-4 md:p-8 transition-colors duration-500">

    <!-- Header & Greeting Section -->
    <header class="relative text-center p-8 md:p-12 mb-8 bg-white/80 dark:bg-gradient-to-br dark:from-indigo-900/80 dark:via-purple-900/70 dark:to-slate-800/80 backdrop-blur-xl rounded-3xl border border-purple-200 dark:border-indigo-500/30 shadow-2xl transition-colors duration-500">
        <!-- Dark/Light Mode Toggle Button -->
        <button id="theme-toggle" class="absolute top-4 right-4 p-3 rounded-xl bg-purple-100 dark:bg-white/10 hover:bg-purple-200 dark:hover:bg-white/20 backdrop-blur-sm border border-purple-300 dark:border-white/20 transition-all duration-300 group" aria-label="Toggle theme">
            <span id="theme-icon" class="text-2xl">🌙</span>
        </button>
        
        <h1 id="time-display" class="text-5xl md:text-7xl font-bold bg-gradient-to-r from-purple-600 via-pink-500 to-cyan-500 dark:from-purple-400 dark:via-pink-400 dark:to-cyan-400 bg-clip-text text-transparent mb-2">00:00:00</h1>
        <p id="date-display" class="text-lg md:text-xl text-slate-600 dark:text-slate-300 mb-4">Thursday, September 10, 2026</p>
        
        <!-- Greeting dengan Edit Button -->
        <div class="flex items-center justify-center gap-3">
            <h2 class="text-2xl md:text-3xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                <span id="greeting-text" class="bg-gradient-to-r from-slate-800 to-purple-600 dark:from-white dark:to-purple-300 bg-clip-text text-transparent">Good Morning</span>
                <span id="greeting-emoji" class="text-3xl md:text-4xl">🌅</span>
            </h2>
            <button id="edit-name-btn" class="p-2 rounded-lg bg-purple-100 dark:bg-white/10 hover:bg-purple-200 dark:hover:bg-white/20 backdrop-blur-sm border border-purple-300 dark:border-white/20 transition-all duration-300" aria-label="Edit name" title="Edit your name">
                <span class="text-xl">✏️</span>
            </button>
        </div>
        
        <!-- Name Edit Modal (Hidden by default) -->
        <div id="name-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-md w-full border border-purple-300 dark:border-purple-500/50 shadow-2xl">
                <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-4">Set Your Name</h3>
                <input type="text" id="name-input" placeholder="Enter your name..." 
                    class="w-full px-4 py-3 bg-slate-100 dark:bg-slate-900/50 border border-purple-200 dark:border-purple-500/30 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/30 transition-all mb-4">
                <div class="flex gap-2">
                    <button id="save-name-btn" class="flex-1 px-5 py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200">
                        Save
                    </button>
                    <button id="clear-name-btn" class="px-5 py-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200">
                        Clear
                    </button>
                    <button id="cancel-name-btn" class="px-5 py-3 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white rounded-xl font-semibold transition-all duration-200">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto">

        <!-- Kontainer Utama 3 KOLOM SEJAJAR dengan Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 items-stretch">

            <!-- KOLOM 1: Focus Timer -->
            <section class="bg-white/70 dark:bg-slate-900/40 backdrop-blur-2xl p-6 rounded-3xl border border-purple-200/50 dark:border-purple-500/30 shadow-2xl hover:shadow-purple-500/20 hover:border-purple-400/60 dark:hover:border-purple-400/60 transition-all duration-500 flex flex-col">
                <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-4 pb-3 border-b border-purple-300/50 dark:border-purple-500/30">
                    ⏱️ Focus Timer
                </h3>
                
                <div class="flex flex-col items-center justify-center flex-grow">
                    <p id="timer-display" class="text-5xl md:text-6xl font-bold bg-gradient-to-r from-purple-600 to-pink-500 dark:from-purple-400 dark:to-pink-400 bg-clip-text text-transparent mb-6">30:00</p>
                    
                    <div class="flex flex-wrap gap-2 justify-center w-full">
                        <button id="start-btn" type="button" class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200">
                            Start
                        </button>
                        <button id="stop-btn" type="button" class="px-5 py-2.5 bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200">
                            Stop
                        </button>
                        <button id="reset-btn" type="button" class="px-5 py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200">
                            Reset
                        </button>
                    </div>
                </div>
            </section>

            <!-- KOLOM 2: To-Do List -->
            <section class="bg-white/70 dark:bg-slate-900/40 backdrop-blur-2xl p-6 rounded-3xl border border-purple-200/50 dark:border-purple-500/30 shadow-2xl hover:shadow-purple-500/20 hover:border-purple-400/60 dark:hover:border-purple-400/60 transition-all duration-500 flex flex-col">
                <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-4 pb-3 border-b border-purple-300/50 dark:border-purple-500/30">
                    ✅ Tasks
                </h3>
                
                <form id="todo-form" class="mb-4">
                    <div class="flex gap-2">
                        <input type="text" id="todo-input" placeholder="Add new task..." required 
                            class="flex-1 px-4 py-2.5 bg-slate-100/50 dark:bg-slate-800/50 backdrop-blur-sm border border-purple-200/50 dark:border-purple-500/30 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/30 transition-all text-sm">
                        <button type="submit" class="px-5 py-2.5 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200 text-sm">
                            Add
                        </button>
                    </div>
                </form>

                <div class="flex-grow overflow-hidden flex flex-col">
                    <ul id="todo-list" class="space-y-2 overflow-y-auto custom-scrollbar flex-grow pr-2">
                        <!-- Task items will be dynamically rendered by JS here -->
                    </ul>
                </div>
            </section>

            <!-- KOLOM 3: Quick Links -->
            <section class="bg-white/70 dark:bg-slate-900/40 backdrop-blur-2xl p-6 rounded-3xl border border-purple-200/50 dark:border-purple-500/30 shadow-2xl hover:shadow-purple-500/20 hover:border-purple-400/60 dark:hover:border-purple-400/60 transition-all duration-500 flex flex-col md:col-span-2 xl:col-span-1">
                <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-4 pb-3 border-b border-purple-300/50 dark:border-purple-500/30">
                    🔗 Quick Links
                </h3>
                
                <form id="link-form" class="space-y-2 mb-4">
                    <input type="text" id="link-name" placeholder="Link name..." required 
                        class="w-full px-4 py-2.5 bg-slate-100/50 dark:bg-slate-800/50 backdrop-blur-sm border border-purple-200/50 dark:border-purple-500/30 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/30 transition-all text-sm">
                    
                    <input type="url" id="link-url" placeholder="URL (e.g. https://...)" required 
                        class="w-full px-4 py-2.5 bg-slate-100/50 dark:bg-slate-800/50 backdrop-blur-sm border border-purple-200/50 dark:border-purple-500/30 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/30 transition-all text-sm">
                    
                    <button type="submit" class="w-full px-5 py-2.5 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white rounded-xl font-semibold shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200 text-sm">
                        Add Link
                    </button>
                </form>

                <div class="flex-grow overflow-hidden flex flex-col">
                    <div id="links-container" class="space-y-2 overflow-y-auto custom-scrollbar flex-grow pr-2">
                        <!-- Quick link buttons will be inserted by JS here -->
                    </div>
                </div>
            </section>

        </div>

    </main>
    
    <!-- JavaScript -->
    <script src="js/script.js?v=2"></script>
</body>
</html>
