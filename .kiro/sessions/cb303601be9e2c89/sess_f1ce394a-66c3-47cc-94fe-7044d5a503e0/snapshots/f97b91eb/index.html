<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and elegant To-Do List Life Dashboard with focus timer and quick links">
    <title>To-Do List Life Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header & Greeting Section -->
    <header>
        <h1 id="time-display">00:00:00</h1>
        <p id="date-display">Thursday, September 10, 2026</p>
        <h2 id="greeting-text">Good Morning, Yudha</h2>
    </header>

    <!-- Main Content Area -->
    <main>

        <!-- 1. Focus Timer Section -->
        <section>
            <h3>Focus Timer</h3>
            <p id="timer-display">30:00</p>
            <nav> 
                <button id="start-btn" type="button">Start</button>
                <button id="stop-btn" type="button">Stop</button>
                <button id="reset-btn" type="button">Reset</button>
            </nav>
        </section>

        <!-- 2. To-Do List Section -->
        <section>
            <h3>Tasks</h3>
            <form id="todo-form">
                <label for="todo-input">Add a new task</label>
                <input type="text" id="todo-input" placeholder="Type your task here..." required>
                <button type="submit">Add Task</button>
            </form>

            <h4>Task List:</h4>
            <ul id="todo-list">
                <!-- Task items will be dynamically rendered by JS here -->
            </ul>
        </section>

        <!-- 3. Quick Links Section -->
        <section>
            <h3>Quick Links</h3>
            <form id="link-form">
                <label for="link-name">Link name:</label>
                <input type="text" id="link-name" placeholder="Github" required>

                <label for="link-url">URL:</label>
                <input type="url" id="link-url" placeholder="https://..." required>

                <button type="submit">Add Link</button>
            </form>

            <h4>Favorite Links:</h4>
            <nav id="links-container">
                <!-- Quick link buttons will be inserted by JS here -->
            </nav>
        </section>

    </main>
    
    <!-- JavaScript -->
    <script src="js/script.js"></script>    
</body>
</html>
