<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern To-Do List Life Dashboard with focus timer and quick links">
    <title>To-Do List Life Dashboard</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS (tetap dipertahankan untuk styling tambahan) -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8b5cf6',
                        secondary: '#06b6d4',
                        accent: '#ec4899',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen text-white p-4 md:p-8">

    <!-- Header & Greeting Section -->
    <header class="text-center p-8 md:p-12 mb-8 bg-slate-800/50 backdrop-blur-xl rounded-3xl border border-slate-700/50 shadow-2xl">
        <h1 id="time-display" class="text-5xl md:text-7xl font-bold bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent mb-2">00:00:00</h1>
        <p id="date-display" class="text-lg md:text-xl text-slate-300 mb-4">Thursday, September 10, 2026</p>
        <h2 id="greeting-text" class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-white to-purple-300 bg-clip-text text-transparent">Good Morning, Yudha</h2>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto">

        <!-- Kontainer Utama 2 Kolom -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">

            <!-- KOLOM KIRI: Focus Timer -->
            <section class="bg-slate-800/50 backdrop-blur-xl p-8 rounded-2xl border border-slate-700/50 shadow-xl hover:shadow-2xl transition-all duration-300 hover:-translate-y-1">
                <h3 class="text-2xl font-bold text-white border-b-2 border-pink-500 pb-3 mb-6">Focus Timer</h3>
                
                <div class="flex flex-col items-center justify-center my-8">
                    <p id="timer-display" class="text-6xl md:text-7xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent mb-8">30:00</p>
                    
                    <div class="flex flex-wrap gap-3 justify-center">
                        <button id="start-btn" type="button" class="px-6 py-3 bg-gradient-to-r from-emerald-400 to-emerald-500 hover:from-emerald-500 hover:to-emerald-600 text-slate-900 rounded-xl font-bold shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all duration-200">
                            Start
                        </button>
                        <button id="stop-btn" type="button" class="px-6 py-3 bg-gradient-to-r from-red-400 to-red-500 hover:from-red-500 hover:to-red-600 text-white rounded-xl font-bold shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all duration-200">
                            Stop
                        </button>
                        <button id="reset-btn" type="button" class="px-6 py-3 bg-gradient-to-r from-yellow-400 to-yellow-500 hover:from-yellow-500 hover:to-yellow-600 text-slate-900 rounded-xl font-bold shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all duration-200">
                            Reset
                        </button>
                    </div>
                </div>
            </section>

            <!-- KOLOM KANAN: To-Do List -->
            <section class="bg-slate-800/50 backdrop-blur-xl p-8 rounded-2xl border border-slate-700/50 shadow-xl hover:shadow-2xl transition-all duration-300 hover:-translate-y-1">
                <h3 class="text-2xl font-bold text-white border-b-2 border-pink-500 pb-3 mb-6">Tasks</h3>
                
                <form id="todo-form" class="mb-6">
                    <label for="todo-input" class="block text-sm font-semibold text-purple-300 uppercase tracking-wider mb-2">Add a new task</label>
                    <div class="flex gap-2">
                        <input type="text" id="todo-input" placeholder="Type your task here..." required 
                            class="flex-1 px-4 py-3 bg-slate-900/50 backdrop-blur-sm border-2 border-slate-700 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 transition-all">
                        <button type="submit" class="px-6 py-3 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white rounded-xl font-bold shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all duration-200">
                            Add
                        </button>
                    </div>
                </form>

                <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Task List:</h4>
                <ul id="todo-list" class="space-y-2 max-h-80 overflow-y-auto custom-scrollbar">
                    <!-- Task items will be dynamically rendered by JS here -->
                </ul>
            </section>

        </div>

        <!-- Quick Links Section (Full Width) -->
        <section class="bg-slate-800/50 backdrop-blur-xl p-8 rounded-2xl border border-slate-700/50 shadow-xl hover:shadow-2xl transition-all duration-300 hover:-translate-y-1">
            <h3 class="text-2xl font-bold text-white border-b-2 border-pink-500 pb-3 mb-6">Quick Links</h3>
            
            <form id="link-form" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div>
                    <label for="link-name" class="block text-sm font-semibold text-purple-300 uppercase tracking-wider mb-2">Link Name</label>
                    <input type="text" id="link-name" placeholder="Github" required 
                        class="w-full px-4 py-3 bg-slate-900/50 backdrop-blur-sm border-2 border-slate-700 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 transition-all">
                </div>

                <div>
                    <label for="link-url" class="block text-sm font-semibold text-purple-300 uppercase tracking-wider mb-2">URL</label>
                    <input type="url" id="link-url" placeholder="https://..." required 
                        class="w-full px-4 py-3 bg-slate-900/50 backdrop-blur-sm border-2 border-slate-700 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 transition-all">
                </div>

                <div class="flex items-end">
                    <button type="submit" class="w-full px-6 py-3 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white rounded-xl font-bold shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all duration-200">
                        Add Link
                    </button>
                </div>
            </form>

            <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Favorite Links:</h4>
            <div id="links-container" class="flex flex-wrap gap-3">
                <!-- Quick link buttons will be inserted by JS here -->
            </div>
        </section>

    </main>
    
    <!-- JavaScript -->
    <script src="js/script.js"></script>
    
    <!-- Custom Scrollbar Style -->
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #7c3aed, #db2777);
        }
    </style>
</body>
</html>
