<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Everyone</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8">
            <!-- Judul -->
            <h1 class="text-4xl font-bold text-center text-gray-800 mb-6">
                Hello Everyone
            </h1>
            
            <!-- Teks Deskripsi -->
            <p class="text-gray-600 text-center mb-8 leading-relaxed">
                Selamat datang di halaman web sederhana ini! Ini adalah contoh halaman HTML 
                yang dibuat menggunakan Tailwind CSS. Halaman ini menampilkan judul, teks 
                deskripsi, dan gambar karakter favorit dari Bikini Bottom.
            </p>
            
            <!-- Gambar Spongebob -->
            <div class="flex justify-center">
                <img 
                    src="https://upload.wikimedia.org/wikipedia/en/thumb/3/3b/SpongeBob_SquarePants_character.svg/1200px-SpongeBob_SquarePants_character.svg.png" 
                    alt="Spongebob Squarepants" 
                    class="w-64 h-auto rounded-lg shadow-md hover:scale-105 transition-transform duration-300"
                />
            </div>
        </div>
    </div>
</body>
</html>
