<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Everyone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .animate-fadeInDown {
            animation: fadeInDown 1s ease-out;
        }

        .animate-fadeInUp {
            animation: fadeInUp 1s ease-out;
        }

        .animate-bounce-slow {
            animation: bounce 2s infinite;
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-violet-900 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8">
            <!-- Judul -->
            <h1 class="text-4xl font-bold text-center text-gray-800 mb-6">
                Hello Everyone
            </h1>
            
            <!-- Teks Deskripsi -->
            <p class="text-gray-600 text-center mb-8 leading-relaxed">
                Selamat datang di halaman web sederhana ini! Ini adalah contoh coding halaman HTML 
                yang dibuat menggunakan Tailwind CSS.
                <br>
                 Halaman ini menampilkan gambar meme Spongebob lagi duduk.
            </p>
            
            <!-- Gambar Spongebob -->
            <div class="flex flex-col items-center">
                <img 
                    src="https://i.pinimg.com/736x/df/33/42/df3342d189242e678d4eb151c746547e.jpg" 
                    alt="Spongebob Squarepants" 
                    class="w-64 h-auto rounded-lg shadow-md hover:scale-105 transition-transform duration-300"
                />
                <p class="text-gray-500 text-sm mt-4 italic">
                    <h1> 
                        <b>meme lagi duduk😂</b> 
                    </h1>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
